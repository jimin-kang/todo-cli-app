[project]
name = "di-todo-app"
version = "0.1.0"
description = "Command line ToDo list application."
readme = "README.md"
authors = [
    { name = "jimin-kang", email = "jimin.kang821@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cmd2>=4.2.4",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "sqlmodel>=0.0.42",
    "textual>=8.2.8",
    "textual-datepicker>=0.2.4",
]

[project.scripts]
di-todo-app = "di_todo_app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
